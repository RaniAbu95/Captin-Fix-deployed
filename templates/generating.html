<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="5" />
    <title>Captain Fix — Generating Test Plan</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='logo.svg') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-light bg-white border-bottom mb-4">
      <div class="container">
        <span class="navbar-brand fw-bold d-flex align-items-center gap-2"><img src="{{ url_for('static', filename='logo.svg') }}" alt="" width="28" height="28" />Captain Fix</span>
        <div class="d-flex align-items-center gap-3">
          <span class="text-muted small">{{ current_user.email }}</span>
          <a href="{{ url_for('auth.logout') }}" class="btn btn-outline-secondary btn-sm">Sign Out</a>
        </div>
      </div>
    </nav>
    <div class="container py-5 text-center" style="max-width: 640px;">
      <div class="spinner-border text-primary mb-4" style="width: 3rem; height: 3rem;" role="status"></div>
      <h2 class="mb-3">Generating the test plan…</h2>
      <p class="text-muted mb-1">Crawling <strong>{{ target }}</strong> and writing test cases.</p>
      <p class="text-muted small">This usually takes a few minutes. This page refreshes automatically — keep it open.</p>
    </div>
  </body>
</html>
